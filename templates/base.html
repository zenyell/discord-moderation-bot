<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Mask{% endblock %} — Mask</title>

  <script>
    (function(){
      var t = localStorage.getItem('mp-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='sg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2373b8ff'/%3E%3Cstop offset='100%25' stop-color='%233a8ee8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2 L28 7 L28 16 C28 23 22 28.5 16 30 C10 28.5 4 23 4 16 L4 7 Z' fill='%23a8d4ff' rx='4'/%3E%3Cpath d='M16 4 L26 8.5 L26 16 C26 22 21 26.8 16 28.2 C11 26.8 6 22 6 16 L6 8.5 Z' fill='url(%23sg)'/%3E%3Ccircle cx='12.5' cy='14' r='1.8' fill='white'/%3E%3Ccircle cx='19.5' cy='14' r='1.8' fill='white'/%3E%3Cpath d='M11.5 19.5 Q16 22.5 20.5 19.5' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E'>

  <style>
    /* ═══════════════════════════════════════════════
       APPLE iOS 26 LIQUID GLASS — DESIGN TOKENS
    ═══════════════════════════════════════════════ */
    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      --glass-bg:           rgba(30, 20, 50, 0.55);
      --glass-bg-light:     rgba(255,255,255,0.08);
      --glass-bg-hover:     rgba(255,255,255,0.13);
      --glass-border:       rgba(255,255,255,0.18);
      --glass-border-strong:rgba(255,255,255,0.28);
      --glass-inset:        inset 0 1.5px 0 rgba(255,255,255,0.22);
      --glass-blur:         blur(28px) saturate(180%);
      --glass-blur-heavy:   blur(48px) saturate(200%);

      --ios-purple:    #bf5af2;
      --ios-purple-2:  #9b59f5;
      --ios-blue:      #0a84ff;
      --ios-teal:      #32ade6;
      --ios-green:     #30d158;
      --ios-orange:    #ff9f0a;
      --ios-red:       #ff453a;
      --ios-pink:      #ff375f;
      --ios-yellow:    #ffd60a;

      --text:         rgba(255,255,255,0.95);
      --text-2:       rgba(255,255,255,0.62);
      --text-3:       rgba(255,255,255,0.38);

      --shadow-sm:  0 2px 8px rgba(0,0,0,0.35);
      --shadow-md:  0 8px 28px rgba(0,0,0,0.45);
      --shadow-lg:  0 20px 60px rgba(0,0,0,0.55);
      --shadow-glass: 0 8px 32px rgba(0,0,0,0.45), inset 0 1.5px 0 rgba(255,255,255,0.22);

      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 22px;
      --r-xl: 30px;

      --tabbar-h: 82px;

      --t-spring: 420ms cubic-bezier(0.34,1.36,0.64,1);
      --t-ease:   250ms cubic-bezier(0.16,1,0.3,1);
    }

    [data-theme="light"] {
      --glass-bg:           rgba(255,255,255,0.52);
      --glass-bg-light:     rgba(255,255,255,0.72);
      --glass-bg-hover:     rgba(255,255,255,0.82);
      --glass-border:       rgba(0,0,0,0.10);
      --glass-border-strong:rgba(0,0,0,0.18);
      --glass-inset:        inset 0 1.5px 0 rgba(255,255,255,0.90);
      --text:         rgba(20,10,40,0.92);
      --text-2:       rgba(20,10,40,0.55);
      --text-3:       rgba(20,10,40,0.32);
      --shadow-sm:  0 2px 8px rgba(120,80,200,0.10);
      --shadow-md:  0 8px 28px rgba(120,80,200,0.14);
      --shadow-lg:  0 20px 60px rgba(120,80,200,0.18);
      --shadow-glass: 0 8px 32px rgba(120,80,200,0.18), inset 0 1.5px 0 rgba(255,255,255,0.90);
    }

    [data-theme="midnight"] {
      --ios-purple:    #00d4ff;
      --ios-purple-2:  #00b8e6;
      --ios-blue:      #00d4ff;
      --ios-green:     #00ff9d;
      --ios-orange:    #ff9f0a;
      --ios-red:       #ff453a;
      --ios-pink:      #00d4ff;
      --glass-bg:           rgba(0, 12, 30, 0.70);
      --glass-bg-light:     rgba(0, 180, 255, 0.07);
      --glass-bg-hover:     rgba(0, 180, 255, 0.14);
      --glass-border:       rgba(0, 200, 255, 0.16);
      --glass-border-strong:rgba(0, 200, 255, 0.30);
      --glass-inset:        inset 0 1.5px 0 rgba(0, 220, 255, 0.20);
      --text:         rgba(220, 245, 255, 0.95);
      --text-2:       rgba(140, 200, 230, 0.65);
      --text-3:       rgba(80, 160, 200, 0.40);
      --shadow-sm:  0 2px 8px rgba(0,0,0,0.55);
      --shadow-md:  0 8px 28px rgba(0,0,0,0.65);
      --shadow-lg:  0 20px 60px rgba(0,0,0,0.75);
      --shadow-glass: 0 8px 32px rgba(0,0,0,0.65), inset 0 1.5px 0 rgba(0,220,255,0.18);
    }

    [data-theme="space"] {
      --ios-purple:    #c8aaff;
      --ios-purple-2:  #a07aee;
      --ios-blue:      #7ec8ff;
      --ios-teal:      #5de8d8;
      --ios-green:     #44e88a;
      --ios-orange:    #ffd580;
      --ios-red:       #ff6b6b;
      --ios-pink:      #e08aff;
      --ios-yellow:    #ffe588;
      --glass-bg:           rgba(0, 0, 8, 0.75);
      --glass-bg-light:     rgba(180, 160, 255, 0.06);
      --glass-bg-hover:     rgba(180, 160, 255, 0.12);
      --glass-border:       rgba(160, 140, 255, 0.14);
      --glass-border-strong:rgba(200, 180, 255, 0.26);
      --glass-inset:        inset 0 1.5px 0 rgba(220, 210, 255, 0.18);
      --text:         rgba(235, 230, 255, 0.96);
      --text-2:       rgba(180, 170, 220, 0.65);
      --text-3:       rgba(120, 110, 170, 0.40);
      --shadow-sm:  0 2px 8px rgba(0,0,0,0.75);
      --shadow-md:  0 8px 28px rgba(0,0,0,0.85);
      --shadow-lg:  0 20px 60px rgba(0,0,0,0.92);
      --shadow-glass: 0 8px 32px rgba(0,0,0,0.85), inset 0 1.5px 0 rgba(200,190,255,0.16);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      background: #0d0820;
      overflow-x: hidden;
    }
    [data-theme="light"]    body { background: #ede8fa; }
    [data-theme="midnight"] body { background: #00060f; }
    [data-theme="space"]    body { background: #000008; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    :focus-visible { outline: 2px solid var(--ios-purple); outline-offset: 3px; border-radius: 6px; }

    /* ── Background wallpaper ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(120,50,255,0.38) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 10%, rgba(191,90,242,0.28) 0%, transparent 55%),
        radial-gradient(ellipse 60% 70% at 60% 90%, rgba(10,132,255,0.20) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 70%, rgba(50,173,230,0.16) 0%, transparent 55%),
        linear-gradient(160deg, #0d0820 0%, #130a2e 40%, #0e1540 100%);
      pointer-events: none;
    }
    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(160,100,255,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 10%, rgba(191,90,242,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 60% 70% at 60% 90%, rgba(10,132,255,0.10) 0%, transparent 60%),
        linear-gradient(160deg, #ede8fa 0%, #e0d8f8 100%);
    }
    [data-theme="midnight"] body::before {
      background:
        radial-gradient(ellipse 65% 55% at 10% 15%, rgba(0,100,200,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 90% 5%,  rgba(0,200,255,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 55% 65% at 55% 95%, rgba(0,150,220,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 35% 35% at 85% 65%, rgba(0,80,160,0.20)  0%, transparent 50%),
        linear-gradient(160deg, #00060f 0%, #000d1e 45%, #001228 100%);
    }
    [data-theme="space"] body::before {
      background:
        radial-gradient(ellipse 55% 40% at 12% 18%,  rgba(80,30,160,0.18)  0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 88% 8%,   rgba(100,50,200,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 50% 45% at 50% 92%,  rgba(40,20,120,0.14)  0%, transparent 58%),
        radial-gradient(ellipse 30% 30% at 75% 55%,  rgba(60,20,140,0.08)  0%, transparent 50%),
        linear-gradient(180deg, #000008 0%, #00000e 50%, #000008 100%);
      pointer-events: none;
    }

    /* ══════════════════════════════════════
       KEYFRAMES — required for all pages
    ══════════════════════════════════════ */
    @keyframes card-spring {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }
    @keyframes page-enter {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0)    scale(1);     }
    }
    @keyframes topbar-enter {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0);     }
    }
    @keyframes tabbar-rise {
      from { opacity: 0; transform: translateX(-50%) translateY(24px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0);    }
    }

    /* ── Layout ── */
    .layout {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      min-height: 100dvh;
    }

    .main-wrap {
      flex: 1;
      display: flex; flex-direction: column;
      min-height: 100dvh;
    }

    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-inset);
      animation: topbar-enter 360ms cubic-bezier(0.34,1.30,0.64,1) 60ms both;
    }
    .topbar-title {
      font-size: 15px; font-weight: 700; letter-spacing: -0.2px;
    }
    .topbar-right {
      display: flex; align-items: center; gap: 8px;
    }
    .topbar-btn {
      width: 34px; height: 34px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: var(--glass-bg-light);
      border: 1px solid var(--glass-border);
      color: var(--text-2);
      transition: all var(--t-ease);
    }
    .topbar-btn:hover {
      background: var(--glass-bg-hover);
      color: var(--text);
      box-shadow: var(--shadow-sm);
    }

    .main-content {
      flex: 1;
      padding: 28px 28px calc(var(--tabbar-h) + 24px);
      animation: page-enter 420ms cubic-bezier(0.34,1.20,0.64,1) both;
    }

    /* SPA content swap transition */
    .main-content.spa-out {
      animation: none !important;
      opacity: 0;
      transform: translateY(-6px) scale(0.99);
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
    }
    .main-content.spa-in {
      animation: page-enter 380ms cubic-bezier(0.34,1.20,0.64,1) both !important;
    }

    /* ── Glass cards ── */
    .card, .stat-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-glass);
      padding: 22px;
      opacity: 0;
      animation: card-spring 500ms cubic-bezier(0.34,1.46,0.64,1) forwards;
      transition: box-shadow var(--t-ease), border-color var(--t-ease);
    }
    .card:hover, .stat-card:hover {
      border-color: var(--glass-border-strong);
      box-shadow: 0 16px 48px rgba(0,0,0,0.55), inset 0 1.5px 0 rgba(255,255,255,0.28);
    }
    .card-title {
      font-size: 13px; font-weight: 700;
      color: var(--text-2); text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 16px;
    }

    /* ══════════════════════════════════════
       LIQUID GLASS BOTTOM TAB BAR
    ══════════════════════════════════════ */

    .tab-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(28, 18, 48, 0.62);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255,255,255,0.20);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.26),
        inset 0 -1px 0 rgba(0,0,0,0.18),
        0 8px 40px rgba(0,0,0,0.55),
        0 2px 12px rgba(0,0,0,0.35);
      background-image: linear-gradient(
        180deg,
        rgba(255,255,255,0.10) 0%,
        rgba(255,255,255,0.02) 30%,
        rgba(0,0,0,0.04) 100%
      );
      animation: tabbar-rise 480ms cubic-bezier(0.34,1.36,0.64,1) 100ms both;
    }

    [data-theme="light"] .tab-bar {
      background: rgba(240,236,255,0.68);
      border-color: rgba(160,120,220,0.22);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.92),
        inset 0 -1px 0 rgba(100,60,180,0.08),
        0 8px 40px rgba(100,60,180,0.22),
        0 2px 12px rgba(100,60,180,0.14);
    }
    [data-theme="midnight"] .tab-bar {
      background: rgba(0, 10, 26, 0.68);
      border-color: rgba(0,200,255,0.18);
      box-shadow:
        inset 0 1.5px 0 rgba(0,220,255,0.22),
        inset 0 -1px 0 rgba(0,0,0,0.22),
        0 8px 40px rgba(0,0,0,0.65),
        0 2px 12px rgba(0,180,255,0.12);
    }
    [data-theme="space"] .tab-bar {
      background: rgba(0, 0, 10, 0.72);
      border-color: rgba(160,140,255,0.16);
      box-shadow:
        inset 0 1.5px 0 rgba(200,190,255,0.20),
        inset 0 -1px 0 rgba(0,0,0,0.28),
        0 8px 40px rgba(0,0,0,0.80),
        0 2px 12px rgba(140,120,255,0.10);
    }

    .tab-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 60px;
      height: 54px;
      border-radius: 999px;
      color: var(--text-3);
      transition:
        color var(--t-ease),
        background var(--t-ease),
        transform var(--t-spring);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-decoration: none;
    }
    .tab-item:hover {
      color: var(--text-2);
      transform: translateY(-2px);
    }
    .tab-item:active {
      transform: scale(0.92);
      transition-duration: 80ms;
    }

    .tab-item.active {
      color: var(--text);
    }
    .tab-item.active::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(191,90,242,0.30), rgba(10,132,255,0.22));
      border: 1px solid rgba(191,90,242,0.38);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.28),
        0 4px 18px rgba(191,90,242,0.30),
        0 2px 8px rgba(0,0,0,0.20);
    }
    [data-theme="midnight"] .tab-item.active::before {
      background: linear-gradient(135deg, rgba(0,180,255,0.28), rgba(0,100,200,0.22));
      border-color: rgba(0,200,255,0.36);
      box-shadow:
        inset 0 1.5px 0 rgba(0,220,255,0.26),
        0 4px 18px rgba(0,180,255,0.28),
        0 2px 8px rgba(0,0,0,0.30);
    }
    [data-theme="space"] .tab-item.active::before {
      background: linear-gradient(135deg, rgba(160,130,255,0.26), rgba(80,140,255,0.20));
      border-color: rgba(180,160,255,0.34);
      box-shadow:
        inset 0 1.5px 0 rgba(200,190,255,0.24),
        0 4px 18px rgba(160,130,255,0.26),
        0 2px 8px rgba(0,0,0,0.35);
    }

    .tab-icon {
      position: relative; z-index: 1;
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    .tab-label {
      position: relative; z-index: 1;
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.1px;
      line-height: 1;
    }

    /* ── Buttons ── */
    .btn {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px;
      border-radius: var(--r-md);
      font-size: 13px; font-weight: 600;
      letter-spacing: -0.1px;
      transition: all var(--t-ease);
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--ios-purple), var(--ios-purple-2));
      color: #fff;
      border: 1px solid rgba(191,90,242,0.40);
      box-shadow: 0 4px 18px rgba(191,90,242,0.32), inset 0 1.5px 0 rgba(255,255,255,0.22);
    }
    .btn-primary:hover {
      box-shadow: 0 8px 28px rgba(191,90,242,0.45), inset 0 1.5px 0 rgba(255,255,255,0.28);
      transform: translateY(-1px);
    }
    .btn-glass {
      background: var(--glass-bg-light);
      color: var(--text);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-inset), var(--shadow-sm);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }
    .btn-glass:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-strong);
      transform: translateY(-1px);
      box-shadow: var(--glass-inset), var(--shadow-md);
    }
    .btn-danger {
      background: rgba(255,69,58,0.20);
      color: var(--ios-red);
      border: 1px solid rgba(255,69,58,0.30);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.10);
    }
    .btn-danger:hover {
      background: rgba(255,69,58,0.30);
      border-color: rgba(255,69,58,0.50);
      transform: translateY(-1px);
    }
    .btn:active { transform: scale(0.96) translateY(0) !important; transition-duration: 60ms; }

    /* Liquid ripple */
    .lg-ripple {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      transform: translate(-50%,-50%) scale(0);
      animation: lg-ripple-anim 520ms cubic-bezier(0.16,1,0.3,1) forwards;
      pointer-events: none;
    }
    @keyframes lg-ripple-anim {
      to { transform: translate(-50%,-50%) scale(28); opacity: 0; }
    }

    /* ── Form elements ── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.7px;
      color: var(--text-2);
    }
    .form-control {
      padding: 10px 14px;
      background: var(--glass-bg-light);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 13.5px;
      font-family: var(--font-body);
      transition: border-color var(--t-ease), box-shadow var(--t-ease), background var(--t-ease);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--ios-purple);
      background: var(--glass-bg-hover);
      box-shadow: 0 0 0 3px rgba(191,90,242,0.18);
    }
    .form-control::placeholder { color: var(--text-3); }
    select.form-control { cursor: pointer; }
    textarea.form-control { resize: vertical; min-height: 88px; }

    /* Toggle switch */
    .toggle-wrap { display: flex; align-items: center; gap: 12px; }
    .toggle {
      position: relative; width: 46px; height: 27px; flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer; inset: 0;
      background: rgba(255,255,255,0.12);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      transition: all 300ms cubic-bezier(0.34,1.36,0.64,1);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 21px; height: 21px;
      left: 2px; bottom: 2px;
      background: rgba(255,255,255,0.75);
      border-radius: 50%;
      transition: all 320ms cubic-bezier(0.34,1.46,0.64,1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, var(--ios-purple), var(--ios-purple-2));
      border-color: rgba(191,90,242,0.40);
      box-shadow: 0 0 12px rgba(191,90,242,0.35);
    }
    .toggle input:checked + .toggle-slider::before {
      transform: translateX(19px);
      background: #fff;
    }
    .toggle-label { font-size: 13.5px; font-weight: 500; color: var(--text); }

    /* ── Notifications / Toast ── */
    #toast-container {
      position: fixed; top: 80px; right: 20px; z-index: 9000;
      display: flex; flex-direction: column; gap: 10px;
    }
    .toast {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur-heavy);
      -webkit-backdrop-filter: var(--glass-blur-heavy);
      border: 1px solid var(--glass-border-strong);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-glass);
      font-size: 13px; font-weight: 500;
      min-width: 240px; max-width: 380px;
      animation: toast-in 360ms cubic-bezier(0.34,1.46,0.64,1) both;
    }
    .toast.out { animation: toast-out 280ms ease forwards; }
    .toast-icon { font-size: 16px; flex-shrink: 0; }
    @keyframes toast-in  { from { opacity:0; transform: translateX(32px) scale(0.92); } to { opacity:1; transform: translateX(0) scale(1); } }
    @keyframes toast-out { to   { opacity:0; transform: translateX(32px) scale(0.92); } }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: fade-in 200ms ease both;
    }
    .modal-overlay.closing { animation: fade-out 200ms ease both; }
    @keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }

    .modal {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur-heavy);
      -webkit-backdrop-filter: var(--glass-blur-heavy);
      border: 1px solid var(--glass-border-strong);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-lg), var(--glass-inset);
      padding: 28px;
      width: 100%; max-width: 480px;
      animation: modal-spring 380ms cubic-bezier(0.34,1.46,0.64,1) both;
    }
    .modal-overlay.closing .modal { animation: modal-out 200ms ease both; }
    @keyframes modal-spring { from { opacity:0; transform: scale(0.88) translateY(24px); } to { opacity:1; transform: scale(1) translateY(0); } }
    @keyframes modal-out    { to   { opacity:0; transform: scale(0.92) translateY(12px); } }

    .modal-title {
      font-size: 16px; font-weight: 800; letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 13px; color: var(--text-2); margin-bottom: 24px; line-height: 1.6;
    }
    .modal-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 24px;
    }

    /* ── Loading indicator ── */
    .spa-loader {
      position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 9999;
      background: linear-gradient(90deg, var(--ios-purple), var(--ios-blue));
      transform: scaleX(0); transform-origin: left;
      transition: transform 300ms ease;
      border-radius: 0 2px 2px 0;
    }
    .spa-loader.active { transform: scaleX(0.85); }
    .spa-loader.done   { transform: scaleX(1); opacity: 0; transition: transform 200ms ease, opacity 300ms ease 100ms; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.14);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.24); }
    [data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.14); }
    [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.24); }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      /* Ensure reduced-motion cards are still visible */
      .card, .stat-card, .feature-card { opacity: 1 !important; }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<div class="spa-loader" id="spaLoader"></div>

<div class="layout">
  <!-- ── Top bar ── -->
  <div class="main-wrap">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <!-- Logo -->
        <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-label="Mask" role="img">
          <defs>
            <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#bf5af2"/>
              <stop offset="100%" stop-color="#0a84ff"/>
            </linearGradient>
          </defs>
          <path d="M16 3 L27 7.5 L27 16 C27 22.5 22 27.5 16 29 C10 27.5 5 22.5 5 16 L5 7.5 Z"
                fill="url(#lg1)" opacity="0.9"/>
          <path d="M16 6 L24.5 9.8 L24.5 16 C24.5 21 20.5 25.2 16 26.5 C11.5 25.2 7.5 21 7.5 16 L7.5 9.8 Z"
                fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.30)" stroke-width="0.8"/>
          <circle cx="12.5" cy="15" r="2" fill="white" opacity="0.9"/>
          <circle cx="19.5" cy="15" r="2" fill="white" opacity="0.9"/>
          <path d="M12 20 Q16 23 20 20" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/>
        </svg>
        <span class="topbar-title">{% block page_title %}Mask{% endblock %}</span>
      </div>
      <div class="topbar-right">
        <!-- Theme cycling button -->
        <button class="topbar-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <!-- Profile / logout -->
        {% if session.get('user_id') %}
        <a href="{{ url_for('logout') }}" class="topbar-btn" title="Logout" aria-label="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
        {% endif %}
      </div>
    </header>

    <!-- ── Page content ── -->
    <main class="main-content" id="spaContent">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- ── Bottom tab bar ── -->
  <nav class="tab-bar" role="navigation" aria-label="Main navigation">
    <a href="{{ url_for('dashboard') }}" class="tab-item {% if request.endpoint == 'dashboard' %}active{% endif %}" data-spa data-spa-title="Dashboard" aria-label="Dashboard">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </span>
      <span class="tab-label">Home</span>
    </a>
    <a href="{{ url_for('moderation') }}" class="tab-item {% if request.endpoint == 'moderation' %}active{% endif %}" data-spa data-spa-title="Moderation" aria-label="Moderation">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </span>
      <span class="tab-label">Mod</span>
    </a>
    <a href="{{ url_for('audit_log') }}" class="tab-item {% if request.endpoint == 'audit_log' %}active{% endif %}" data-spa data-spa-title="Audit Log" aria-label="Audit Log">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </span>
      <span class="tab-label">Logs</span>
    </a>
    <a href="{{ url_for('settings') }}" class="tab-item {% if request.endpoint == 'settings' %}active{% endif %}" data-spa data-spa-title="Settings" aria-label="Settings">
      <span class="tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
      <span class="tab-label">Settings</span>
    </a>
  </nav>
</div>

<!-- ── Toast container ── -->
<div id="toast-container" role="region" aria-live="polite" aria-label="Notifications"></div>

<script>
/* ══════════════════════════════════════════════════
   MASK DASHBOARD — BASE JS
══════════════════════════════════════════════════ */

/* ── Theme cycling ── */
(function(){
  const themes = ['dark','light','midnight','space'];
  const btn = document.getElementById('themeBtn');
  const html = document.documentElement;
  let current = localStorage.getItem('mp-theme') || 'dark';

  function applyTheme(t){
    html.setAttribute('data-theme', t);
    localStorage.setItem('mp-theme', t);
    current = t;
  }
  applyTheme(current);

  if(btn){
    btn.addEventListener('click', function(){
      const idx = (themes.indexOf(current) + 1) % themes.length;
      applyTheme(themes[idx]);
    });
  }
})();

/* ── Toast utility ── */
window.showToast = function(msg, icon='✅', duration=3200){
  const c = document.getElementById('toast-container');
  if(!c) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="toast-icon">${icon}</span><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{
    t.classList.add('out');
    t.addEventListener('animationend',()=>t.remove(),{once:true});
  }, duration);
};

/* ── SPA Navigation ── */
(function(){
  const loader   = document.getElementById('spaLoader');
  const content  = document.getElementById('spaContent');

  function setLoader(state){
    if(!loader) return;
    loader.className = 'spa-loader' + (state ? ' '+state : '');
  }

  async function navigate(url, title){
    if(!content) { location.href = url; return; }

    setLoader('active');
    content.classList.add('spa-out');

    try {
      const res  = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } });
      const html = await res.text();
      const doc  = new DOMParser().parseFromString(html, 'text/html');
      const next = doc.getElementById('spaContent');

      await new Promise(r => setTimeout(r, 140));

      if(next){
        content.innerHTML = next.innerHTML;
      }

      // Re-run inline scripts from new content
      content.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if(old.src) s.src = old.src; else s.textContent = old.textContent;
        old.replaceWith(s);
      });

      // Re-trigger card animations by forcing reflow
      content.querySelectorAll('.card, .stat-card, .feature-card').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight; // reflow
        el.style.animation = '';
      });

      if(title) document.title = title + ' — Mask';
      history.pushState({ url, title }, '', url);

      content.classList.remove('spa-out');
      content.classList.add('spa-in');
      content.addEventListener('animationend', () => content.classList.remove('spa-in'), { once: true });

      // Update active tab
      document.querySelectorAll('.tab-item').forEach(tab => {
        tab.classList.toggle('active', tab.getAttribute('href') === url);
      });

      setLoader('done');
      setTimeout(() => setLoader(''), 400);

    } catch(e) {
      setLoader('');
      location.href = url;
    }
  }

  // Intercept [data-spa] links
  document.addEventListener('click', function(e){
    const link = e.target.closest('[data-spa]');
    if(!link || !link.href) return;
    e.preventDefault();
    navigate(link.href, link.dataset.spaTitle || '');
  });

  // Handle browser back/forward
  window.addEventListener('popstate', function(e){
    if(e.state?.url) navigate(e.state.url, e.state.title || '');
  });
})();

/* ── Ripple on all .btn elements ── */
document.addEventListener('click', function(e){
  const btn = e.target.closest('.btn');
  if(!btn) return;
  const r = document.createElement('span');
  r.className = 'lg-ripple';
  const rect = btn.getBoundingClientRect();
  r.style.top  = (e.clientY - rect.top)  + 'px';
  r.style.left = (e.clientX - rect.left) + 'px';
  btn.appendChild(r);
  r.addEventListener('animationend', () => r.remove(), { once: true });
});
</script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
