{% extends 'base.html' %}
{% block title %}Logging{% endblock %}
{% block page_title %}Logging{% endblock %}
{% block content %}
<div style="max-width:600px">
  <form method="post">
    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Log Channel
      </div>
      <div class="form-group">
        <label class="form-label">Channel ID</label>
        <input type="text" name="log_channel_id" class="form-control" value="{{ cfg.log_channel_id }}" placeholder="Discord channel ID for logs">
      </div>
    </div>
    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Events to Log
      </div>
      {% for e in events %}
      <div class="toggle-row">
        <div class="toggle-info">
          <h4>{{ e.label }}</h4>
          <p>{{ e.desc }}</p>
        </div>
        <label class="toggle">
          <input type="checkbox" name="log_{{ e.key }}" {% if cfg['log_' + e.key] == '1' %}checked{% endif %}>
          <span class="toggle-track"></span>
        </label>
      </div>
      {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Save Logging Settings</button>
  </form>
</div>
{% endblock %}
