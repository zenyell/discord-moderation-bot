<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Mask</title>

  <script>
    (function(){
      var t = localStorage.getItem('mp-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23bf5af2' opacity='.18'/%3E%3Cpath d='M16 6a10 10 0 1 0 0 20A10 10 0 0 0 16 6zm0 3a7 7 0 1 1 0 14A7 7 0 0 1 16 9zm-1 3v5.27l4 2.4-.78 1.33L13 18V12h2z' fill='%23bf5af2'/%3E%3C/svg%3E">

  <style>
    /* ═══ TOKENS ═══ */
    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --glass-bg:            rgba(30, 20, 50, 0.55);
      --glass-bg-light:      rgba(255,255,255,0.08);
      --glass-bg-hover:      rgba(255,255,255,0.13);
      --glass-border:        rgba(255,255,255,0.18);
      --glass-border-strong: rgba(255,255,255,0.28);
      --glass-inset:         inset 0 1.5px 0 rgba(255,255,255,0.22);
      --glass-blur:          blur(28px) saturate(180%);
      --glass-blur-heavy:    blur(48px) saturate(200%);
      --ios-purple:  #bf5af2;
      --ios-purple-2:#9b59f5;
      --ios-blue:    #0a84ff;
      --ios-teal:    #32ade6;
      --ios-green:   #30d158;
      --text:   rgba(255,255,255,0.95);
      --text-2: rgba(255,255,255,0.62);
      --text-3: rgba(255,255,255,0.38);
      --shadow-sm:    0 2px 8px rgba(0,0,0,0.35);
      --shadow-md:    0 8px 28px rgba(0,0,0,0.45);
      --shadow-lg:    0 20px 60px rgba(0,0,0,0.55);
      --shadow-glass: 0 8px 32px rgba(0,0,0,0.45), inset 0 1.5px 0 rgba(255,255,255,0.22);
      --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
      --t-spring: 420ms cubic-bezier(0.34,1.36,0.64,1);
      --t-ease:   250ms cubic-bezier(0.16,1,0.3,1);
    }
    [data-theme="light"] {
      --glass-bg:            rgba(255,255,255,0.52);
      --glass-bg-light:      rgba(255,255,255,0.72);
      --glass-bg-hover:      rgba(255,255,255,0.82);
      --glass-border:        rgba(0,0,0,0.10);
      --glass-border-strong: rgba(0,0,0,0.18);
      --glass-inset:         inset 0 1.5px 0 rgba(255,255,255,0.90);
      --text:   rgba(20,10,40,0.92);
      --text-2: rgba(20,10,40,0.55);
      --text-3: rgba(20,10,40,0.32);
      --shadow-glass: 0 8px 32px rgba(120,80,200,0.18), inset 0 1.5px 0 rgba(255,255,255,0.90);
    }
    [data-theme="midnight"] {
      --ios-purple: #00d4ff; --ios-purple-2: #00b8e6; --ios-blue: #00d4ff; --ios-green: #00ff9d;
      --glass-bg:            rgba(0,12,30,0.70);
      --glass-bg-light:      rgba(0,180,255,0.07);
      --glass-bg-hover:      rgba(0,180,255,0.14);
      --glass-border:        rgba(0,200,255,0.16);
      --glass-border-strong: rgba(0,200,255,0.30);
      --glass-inset:         inset 0 1.5px 0 rgba(0,220,255,0.20);
      --text:   rgba(220,245,255,0.95);
      --text-2: rgba(140,200,230,0.65);
      --text-3: rgba(80,160,200,0.40);
      --shadow-glass: 0 8px 32px rgba(0,0,0,0.65), inset 0 1.5px 0 rgba(0,220,255,0.18);
    }
    [data-theme="space"] {
      --ios-purple: #c8aaff; --ios-purple-2: #a07aee; --ios-blue: #7ec8ff;
      --glass-bg:            rgba(0,0,8,0.75);
      --glass-bg-light:      rgba(180,160,255,0.06);
      --glass-bg-hover:      rgba(180,160,255,0.12);
      --glass-border:        rgba(160,140,255,0.14);
      --glass-border-strong: rgba(200,180,255,0.26);
      --glass-inset:         inset 0 1.5px 0 rgba(220,210,255,0.18);
      --text:   rgba(235,230,255,0.96);
      --text-2: rgba(180,170,220,0.65);
      --text-3: rgba(120,110,170,0.40);
      --shadow-glass: 0 8px 32px rgba(0,0,0,0.85), inset 0 1.5px 0 rgba(200,190,255,0.16);
    }

    /* ═══ RESET ═══ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      background: #0d0820;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    [data-theme="light"]    body { background: #ede8fa; }
    [data-theme="midnight"] body { background: #00060f; }
    [data-theme="space"]    body { background: #000008; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--ios-purple); outline-offset: 3px; border-radius: 6px; }

    /* ═══ BG ═══ */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(120,50,255,0.38) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 10%, rgba(191,90,242,0.28) 0%, transparent 55%),
        radial-gradient(ellipse 60% 70% at 60% 90%, rgba(10,132,255,0.20) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 70%, rgba(50,173,230,0.16) 0%, transparent 55%),
        linear-gradient(160deg, #0d0820 0%, #130a2e 40%, #0e1540 100%);
      pointer-events: none;
    }
    [data-theme="light"] body::before {
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(160,100,255,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 85% 10%, rgba(191,90,242,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 60% 70% at 60% 90%, rgba(10,132,255,0.10) 0%, transparent 60%),
        linear-gradient(160deg, #ede8fa 0%, #e0d8f8 100%);
    }
    [data-theme="midnight"] body::before {
      background:
        radial-gradient(ellipse 65% 55% at 10% 15%, rgba(0,100,200,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 90% 5%,  rgba(0,200,255,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 55% 65% at 55% 95%, rgba(0,150,220,0.22) 0%, transparent 60%),
        linear-gradient(160deg, #00060f 0%, #000d1e 45%, #001228 100%);
    }
    [data-theme="space"] body::before {
      background:
        radial-gradient(ellipse 55% 40% at 12% 18%,  rgba(80,30,160,0.18)  0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 88% 8%,   rgba(100,50,200,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 50% 45% at 50% 92%,  rgba(40,20,120,0.14)  0%, transparent 58%),
        linear-gradient(180deg, #000008 0%, #00000e 50%, #000008 100%);
    }

    /* ═══ ORBS ═══ */
    #orb-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb-particle { position: absolute; border-radius: 50%; filter: blur(55px); opacity: 0; will-change: transform,opacity; animation: orb-float linear infinite; }
    @keyframes orb-float {
      0%   { transform: translate(0,0) scale(1);    opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(var(--tx),var(--ty)) scale(1.12); }
      90%  { opacity: 0.6; }
      100% { transform: translate(0,0) scale(1);    opacity: 0; }
    }
    #cursor-glow {
      position: fixed; width: 320px; height: 320px; border-radius: 50%;
      pointer-events: none; z-index: 2;
      background: radial-gradient(circle, rgba(191,90,242,0.09) 0%, transparent 70%);
      transform: translate(-50%,-50%);
      transition: left 80ms linear, top 80ms linear;
      will-change: left, top;
    }
    [data-theme="midnight"] #cursor-glow { background: radial-gradient(circle, rgba(0,180,255,0.09) 0%, transparent 70%); }
    [data-theme="space"]    #cursor-glow { background: radial-gradient(circle, rgba(180,160,255,0.07) 0%, transparent 70%); }

    /* ═══ TOPNAV ═══ */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-inset);
      animation: topbar-enter 380ms cubic-bezier(0.34,1.30,0.64,1) 60ms both;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--ios-purple), var(--ios-blue));
      box-shadow: 0 4px 16px rgba(191,90,242,0.45);
      color: #fff;
    }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      width: 34px; height: 34px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: var(--glass-bg-light);
      border: 1px solid var(--glass-border);
      color: var(--text-2);
      transition: all var(--t-ease);
    }
    .nav-btn:hover { background: var(--glass-bg-hover); color: var(--text); box-shadow: var(--shadow-sm); }

    /* ═══ LOGIN LAYOUT ═══ */
    .login-page {
      position: relative; z-index: 1;
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 100px 24px 60px;
      min-height: 100dvh;
    }
    .login-card {
      width: 100%; max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur-heavy);
      -webkit-backdrop-filter: var(--glass-blur-heavy);
      border: 1px solid var(--glass-border-strong);
      border-radius: var(--r-xl);
      box-shadow: 0 24px 80px rgba(0,0,0,0.55), inset 0 1.5px 0 rgba(255,255,255,0.28);
      padding: 48px 40px 44px;
      animation: card-rise 560ms cubic-bezier(0.34,1.46,0.64,1) 100ms both;
    }

    /* logo */
    .login-logo {
      width: 64px; height: 64px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--ios-purple), var(--ios-blue));
      box-shadow: 0 8px 32px rgba(191,90,242,0.55);
      color: #fff;
      margin: 0 auto 24px;
    }
    [data-theme="midnight"] .login-logo { box-shadow: 0 8px 32px rgba(0,180,255,0.55); }
    [data-theme="space"]    .login-logo { box-shadow: 0 8px 32px rgba(160,140,255,0.45); }

    .login-title {
      text-align: center;
      font-size: 22px; font-weight: 800; letter-spacing: -0.04em;
      margin-bottom: 8px;
    }
    .login-sub {
      text-align: center;
      font-size: 13.5px; color: var(--text-2); line-height: 1.6;
      margin-bottom: 32px;
    }

    /* divider */
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 24px;
    }
    .login-divider::before,
    .login-divider::after {
      content: ''; flex: 1;
      height: 1px;
      background: var(--glass-border);
    }
    .login-divider span {
      font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--text-3); white-space: nowrap;
    }

    /* discord btn */
    .btn-discord {
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 13px 20px;
      border-radius: 9999px;
      font-family: var(--font-body); font-size: 14px; font-weight: 700;
      letter-spacing: -0.1px; cursor: pointer; user-select: none;
      background: linear-gradient(150deg, rgba(88,101,242,0.70) 0%, rgba(60,80,220,0.55) 100%);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(88,101,242,0.55);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.35),
        inset 0 -1.2px 0 rgba(0,0,0,0.25),
        0 4px 20px rgba(88,101,242,0.45),
        0 8px 36px rgba(60,80,220,0.25);
      background-image: linear-gradient(158deg,rgba(255,255,255,0.20) 0%,rgba(255,255,255,0.06) 38%,rgba(255,255,255,0.00) 55%,rgba(0,0,0,0.06) 100%),
                        linear-gradient(150deg, rgba(88,101,242,0.70) 0%, rgba(60,80,220,0.55) 100%);
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.35);
      text-decoration: none;
      transition: transform 320ms cubic-bezier(0.34,1.36,0.64,1), box-shadow 280ms cubic-bezier(0.16,1,0.3,1), border-color 240ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-discord::before {
      content:''; position:absolute; inset:0; border-radius:inherit;
      background: radial-gradient(ellipse 80% 50% at 50% -10%,rgba(255,255,255,0.28) 0%,rgba(255,255,255,0.06) 50%,transparent 100%);
      pointer-events:none;
    }
    .btn-discord::after {
      content:''; position:absolute; top:0; bottom:0; left:-60%; width:40%;
      background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.18) 40%,rgba(255,255,255,0.28) 50%,rgba(255,255,255,0.18) 60%,transparent 100%);
      pointer-events:none; opacity:0;
    }
    .btn-discord:hover::after { animation: lg-shimmer 650ms cubic-bezier(0.16,1,0.3,1) forwards; }
    .btn-discord:hover {
      transform: translateY(-2px) scale(1.015);
      border-color: rgba(88,101,242,0.72);
      box-shadow:
        inset 0 1.8px 0 rgba(255,255,255,0.48),
        inset 0 -1.2px 0 rgba(0,0,0,0.28),
        0 6px 28px rgba(88,101,242,0.62),
        0 12px 48px rgba(60,80,220,0.35);
    }
    .btn-discord:active { transform: translateY(0) scale(0.975); transition-duration: 100ms; }
    .btn-discord .lg-ripple {
      position:absolute; border-radius:50%; background:rgba(255,255,255,0.28);
      pointer-events:none; width:80px; height:80px;
      margin-top:-40px; margin-left:-40px;
      animation: lg-ripple 520ms cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* discord icon */
    .discord-icon { flex-shrink: 0; }

    /* terms note */
    .login-terms {
      text-align: center; margin-top: 20px;
      font-size: 11.5px; color: var(--text-3); line-height: 1.65;
    }
    .login-terms a { color: var(--ios-purple); transition: color var(--t-ease); }
    .login-terms a:hover { color: var(--ios-blue); }

    /* back link */
    .login-back {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 24px;
      font-size: 12.5px; color: var(--text-3);
      transition: color var(--t-ease);
      width: 100%; justify-content: center;
    }
    .login-back:hover { color: var(--text-2); }

    /* shimmer & ripple keyframes */
    @keyframes lg-shimmer {
      0%   { transform: translateX(-100%) skewX(-12deg); opacity: 0; }
      18%  { opacity: 1; }
      60%  { opacity: 0.6; }
      100% { transform: translateX(280%) skewX(-12deg); opacity: 0; }
    }
    @keyframes lg-ripple { from{transform:scale(0);opacity:.45} to{transform:scale(5);opacity:0} }
    @keyframes topbar-enter { from{opacity:0;transform:translateY(-100%)} to{opacity:1;transform:translateY(0)} }
    @keyframes card-rise {
      0%  { opacity:0; transform: translateY(32px) scale(0.96); }
      60% { opacity:1; transform: translateY(-4px) scale(1.006); }
      100%{ opacity:1; transform: translateY(0)   scale(1); }
    }

    @media (max-width: 480px) {
      .topnav { padding: 12px 16px; }
      .login-card { padding: 36px 24px 32px; border-radius: var(--r-lg); }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:0.01ms!important; transition-duration:0.01ms!important; }
    }
  </style>
</head>
<body>

<div id="cursor-glow"></div>
<div id="orb-layer"></div>

<!-- ═══ TOPNAV ═══ -->
<nav class="topnav">
  <a class="nav-brand" href="{{ url_for('landing') }}">
    <div class="brand-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <span class="brand-name">Mask</span>
  </a>
  <div class="nav-right">
    <button class="nav-btn" aria-label="Cycle theme" onclick="cycleTheme()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</nav>

<!-- ═══ LOGIN ═══ -->
<main class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <h1 class="login-title">Welcome to Mask</h1>
    <p class="login-sub">Sign in with your Discord account to access your server dashboard.</p>

    <div class="login-divider"><span>Continue with</span></div>

    <a href="{{ url_for('discord_login') }}" class="btn-discord" role="button">
      <!-- Discord logo -->
      <svg class="discord-icon" width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor" aria-hidden="true">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Sign in with Discord
    </a>

    <p class="login-terms">
      By signing in you agree to our
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>

    <a href="{{ url_for('landing') }}" class="login-back">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to home
    </a>

  </div>
</main>

<script>
/* ── Theme ── */
var THEMES=['dark','light','midnight','space'];
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('mp-theme',t);}
function cycleTheme(){
  var cur=document.documentElement.getAttribute('data-theme')||'dark';
  var next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
  applyTheme(next);
  showThemeToast(next); respawnOrbs(next);
}
function showThemeToast(name){
  var el=document.getElementById('theme-toast'); if(el)el.remove();
  var labels={dark:'🌙 Dark',light:'☀️ Light',midnight:'🌊 Midnight',space:'🌌 Space'};
  var t=document.createElement('div'); t.id='theme-toast'; t.textContent=labels[name]||name;
  t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--glass-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--glass-border);color:var(--text);padding:9px 22px;border-radius:9999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-glass);z-index:9999;opacity:0;transition:opacity 260ms ease,transform 320ms cubic-bezier(0.34,1.56,0.64,1)';
  document.body.appendChild(t);
  requestAnimationFrame(function(){requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';});});
  setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';setTimeout(function(){t.remove();},320);},1800);
}

/* ── Cursor glow ── */
var cg=document.getElementById('cursor-glow');
document.addEventListener('mousemove',function(e){cg.style.left=e.clientX+'px';cg.style.top=e.clientY+'px';});

/* ── Ripple ── */
document.querySelector('.btn-discord').addEventListener('click',function(e){
  var rect=this.getBoundingClientRect();
  var r=document.createElement('span'); r.className='lg-ripple';
  r.style.left=(e.clientX-rect.left)+'px'; r.style.top=(e.clientY-rect.top)+'px';
  this.appendChild(r); r.addEventListener('animationend',function(){r.remove();});
});

/* ── Orbs ── */
var ORB_COLORS={
  dark:    ['rgba(191,90,242,0.55)','rgba(10,132,255,0.45)','rgba(50,173,230,0.40)','rgba(120,50,255,0.50)'],
  light:   ['rgba(160,100,255,0.30)','rgba(10,132,255,0.25)','rgba(191,90,242,0.25)','rgba(80,40,200,0.22)'],
  midnight:['rgba(0,180,255,0.55)','rgba(0,80,200,0.50)','rgba(0,220,255,0.40)','rgba(0,120,220,0.45)'],
  space:   ['rgba(100,70,200,0.30)','rgba(140,100,255,0.25)','rgba(60,40,160,0.22)','rgba(100,80,220,0.20)']
};
function respawnOrbs(theme){
  var layer=document.getElementById('orb-layer'); layer.innerHTML='';
  var colors=ORB_COLORS[theme]||ORB_COLORS.dark;
  for(var i=0;i<6;i++){
    var o=document.createElement('div'); o.className='orb-particle';
    var sz=80+Math.random()*160;
    o.style.cssText=['width:'+sz+'px','height:'+sz+'px','left:'+(Math.random()*100)+'%','top:'+(Math.random()*100)+'%','background:'+colors[i%colors.length],'--tx:'+((Math.random()-0.5)*140)+'px','--ty:'+((Math.random()-0.5)*140)+'px','animation-duration:'+(14+Math.random()*18)+'s','animation-delay:'+(-Math.random()*16)+'s'].join(';');
    layer.appendChild(o);
  }
}
var initTheme=document.documentElement.getAttribute('data-theme')||'dark';
respawnOrbs(initTheme);
</script>
