<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · ModPanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 30 30" fill="none" aria-label="ModPanel logo">
        <rect width="30" height="30" rx="8" fill="#5b8dee"/>
        <rect x="7" y="12" width="16" height="2.5" rx="1.25" fill="white"/>
        <rect x="7" y="17" width="10" height="2.5" rx="1.25" fill="white" opacity=".7"/>
        <circle cx="22" cy="9" r="3.5" fill="white" opacity=".9"/>
      </svg>
      <span class="brand-name">ModPanel</span>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to access your moderation dashboard.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-list" style="margin-bottom:1rem;">
          {% for msg in messages %}<li class="flash">{{ msg }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <form class="login-form" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
