<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ModPanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f; --surface: #131316; --border: rgba(255,255,255,0.07);
      --border-2: rgba(255,255,255,0.12); --text: #e8e8f0; --muted: #6b6b80;
      --faint: #3a3a50; --accent: #7c6bff; --accent-2: #9d8fff;
      --accent-glow: rgba(124,107,255,0.2); --danger: #ff4d6a;
    }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
      animation: loginIn 400ms cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes loginIn { from { opacity:0; transform:translateY(20px) scale(0.97); } to { opacity:1; transform:none; } }
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .login-logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
    }
    .login-card h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
    .form-control {
      width: 100%; background: var(--bg); border: 1px solid var(--border-2);
      border-radius: 8px; padding: 10px 13px; font-size: 14px; color: var(--text);
      font-family: inherit; outline: none;
      transition: border-color 200ms, box-shadow 200ms;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-control::placeholder { color: var(--faint); }
    .btn-login {
      width: 100%; padding: 11px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer; margin-top: 8px;
      transition: all 200ms cubic-bezier(0.16,1,0.3,1);
    }
    .btn-login:hover { background: var(--accent-2); transform: translateY(-1px); box-shadow: 0 6px 20px var(--accent-glow); }
    .btn-login:active { transform: none; }
    .flash { margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; font-size: 13px; background: rgba(255,77,106,0.1); border: 1px solid rgba(255,77,106,0.25); color: var(--danger); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="#7c6bff" fill-opacity="0.2"/>
        <path d="M7 9.5C7 8.12 8.12 7 9.5 7h9C19.88 7 21 8.12 21 9.5v4C21 14.88 19.88 16 18.5 16H13l-4 4v-4H9.5C8.12 16 7 14.88 7 13.5v-4Z" stroke="#7c6bff" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="11" cy="11.5" r="1" fill="#7c6bff"/>
        <circle cx="14" cy="11.5" r="1" fill="#7c6bff"/>
        <circle cx="17" cy="11.5" r="1" fill="#7c6bff"/>
      </svg>
      <span class="login-logo-text">ModPanel</span>
    </div>
    <div class="login-card">
      <h1>Welcome back</h1>
      <p>Sign in to your control panel</p>
      {% with messages = get_flashed_messages() %}{% if messages %}{% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}
      <form method="post">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
