{% extends 'base.html' %}
{% block title %}Starboard{% endblock %}
{% block page_title %}Starboard{% endblock %}
{% block content %}
<div style="max-width:500px">
  <form method="post">
    <div class="card">
      <div class="card-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Starboard Configuration
      </div>
      <div class="toggle-row">
        <div class="toggle-info"><h4>Enable Starboard</h4><p>Pin highly-reacted messages to a channel</p></div>
        <label class="toggle"><input type="checkbox" name="starboard_enabled" {% if cfg.starboard_enabled == '1' %}checked{% endif %}><span class="toggle-track"></span></label>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">Starboard Channel ID</label>
          <input type="text" name="starboard_channel" value="{{ cfg.starboard_channel }}" placeholder="Channel ID">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Minimum Stars</label>
            <input type="number" name="starboard_min" value="{{ cfg.starboard_min or 3 }}" min="1">
          </div>
          <div class="form-group">
            <label class="form-label">Star Emoji</label>
            <input type="text" name="starboard_emoji" value="{{ cfg.starboard_emoji or '⭐' }}">
          </div>
        </div>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Save Starboard</button>
  </form>
</div>
{% endblock %}
